# Git pushes never publish. Live deploys come from GitHub Actions on a prod release.
# netlify.toml ignore/command are a backup if git builds get turned back on.
[build]
  command = "bash ./scripts/netlify-git-build.sh"
  ignore = "bash ./scripts/netlify-ignore.sh"
  publish = "docs"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "22.12.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.dynastyticker.com/*"
  to = "https://dynastyticker.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/rather-vote"
  to = "/.netlify/functions/rather-vote"
  status = 200
  force = true

[[redirects]]
  from = "/api/searched-user"
  to = "/.netlify/functions/searched-user"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://sleepercdn.com; connect-src 'self' https://api.sleeper.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
