# Git pushes never publish. Live deploys come from GitHub Actions on a prod release.
# netlify.toml ignore/command are a backup if git builds get turned back on.
[build]
  command = "bash ./scripts/netlify-git-build.sh"
  ignore = "bash ./scripts/netlify-ignore.sh"
  publish = "docs"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "22.12.0"

# VISIT_SALT and RATHER_SALT must live in the Netlify site environment
# (Functions and Runtime). scripts/deploy_live_site.sh runs
# scripts/ensure_netlify_salts.py before upload. Do not commit the values.
# dynasty-ticker-traffic-v1 and dynasty-ticker-rather-v1 are rejected.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.dynastyticker.com/*"
  to = "https://dynastyticker.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/rather-vote"
  to = "/.netlify/functions/rather-vote"
  status = 200
  force = true

[[redirects]]
  from = "/api/searched-user"
  to = "/.netlify/functions/searched-user"
  status = 200
  force = true

# Reserved desk paths. Exact matches only, after /api, so functions and
# static files (/styles.css, /data/*, /ui/*) are not swallowed.
# /plan has no desk section yet; the app opens the home view.
[[redirects]]
  from = "/trade"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/trade/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/team/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/plan"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/plan/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/history"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/history/"
  to = "/index.html"
  status = 200

# Player pages are real URLs. The app reads /player/<id> after this rewrite.
[[redirects]]
  from = "/player/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://sleepercdn.com https://*.sleepercdn.com; connect-src 'self' https://api.sleeper.app https://fonts.googleapis.com https://fonts.gstatic.com; form-action 'self'; frame-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# data/*.json is not fingerprinted. player_values.json is about 2.9MB.
# max-age=0 lets the browser revalidate instead of keeping a stale price file.
# The CDN still gzip/brotli compresses JSON. Leave compression to the CDN.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
