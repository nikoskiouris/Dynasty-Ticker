name: Refresh live site

# Manual only. A scheduled production deploy costs 15 Netlify credits every day.
# Market files refresh when develop is promoted to prod.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-site]

concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pick-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Read latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name); then
            echo "No published GitHub release yet. Live site stays put until you cut one."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Refreshing last release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    needs: pick-release
    if: needs.pick-release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout last release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick-release.outputs.tag }}

      - name: Require a prod release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.pick-release.outputs.tag }}
        run: bash scripts/assert_prod_release.sh "$RELEASE_TAG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy last release with fresh market files
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MESSAGE: "manual refresh ${{ needs.pick-release.outputs.tag }}"
        run: bash scripts/deploy_live_site.sh
