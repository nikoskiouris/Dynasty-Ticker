name: Tests

on:
  pull_request:
  push:
    branches: ["develop", "prod", "main", "master", "work"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm install

      # Pin the committed snapshot. A live rebuild would hide a bad player_values.json.
      - name: Run tests
        run: npm test
