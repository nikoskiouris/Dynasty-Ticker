name: Refresh independent player values

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 2"
  push:
    branches:
      - codex/independent-player-values
    paths:
      - player-values/**
      - .github/workflows/refresh-player-values.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build independent values
        run: python3 player-values/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate repository
        run: npm test

      - name: Commit refreshed snapshot
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- docs/data/player_values.json player-values/validation.json; then
            echo "No player-value changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/player_values.json player-values/validation.json
          git commit -m "data: refresh independent player values"
          git push
