name: Cut release from prod

on:
  push:
    branches: [prod]

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut-release:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout prod
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/cut_github_release.sh

      # A release published with GITHUB_TOKEN does not trigger release workflows.
      # Pass the published tag directly to the dependent deployment job instead.
      - name: Resolve published release for this commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,targetCommitish \
            --jq "[.[] | select(.targetCommitish==\"$GITHUB_SHA\")][0].tagName")
          [[ "$tag" == prod-* ]] || { echo "No prod release found for $GITHUB_SHA" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    needs: cut-release
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout published release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut-release.outputs.tag }}

      - name: Require a prod release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.cut-release.outputs.tag }}
        run: bash scripts/assert_prod_release.sh "$RELEASE_TAG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy published release
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MESSAGE: ${{ needs.cut-release.outputs.tag }}
        run: bash scripts/deploy_live_site.sh
