<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://sleepercdn.com https://*.sleepercdn.com; connect-src 'self' https://api.sleeper.app; form-action 'self'; frame-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dynasty Ticker — Your Sleeper dynasty league</title>
    <meta name="description" content="See what your players are worth, check a trade, and find your team's next move." />
    <meta name="theme-color" content="#0c0c0e" />
    <script src="./desk-shut.js"></script>
    <meta property="og:title" content="Dynasty Ticker — Your Sleeper dynasty league" />
    <meta property="og:description" content="See what your players are worth, check a trade, and find your team's next move." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dynastyticker.com/" />
    <meta property="og:image" content="https://dynastyticker.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dynasty Ticker: your league on a live ticker" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dynasty Ticker — Your Sleeper dynasty league" />
    <meta name="twitter:description" content="See what your players are worth, check a trade, and find your team's next move." />
    <meta name="twitter:image" content="https://dynastyticker.com/og-image.jpg" />
    <link rel="canonical" href="https://dynastyticker.com/" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./product.css" />
  </head>
  <body>
    <div class="app-frame">
      <header class="mobile-chrome" id="mobile-chrome">
        <button
          type="button"
          id="mobile-rail-toggle"
          class="mobile-icon-btn"
          aria-expanded="false"
          aria-controls="control-rail"
          title="Sections"
        >
          <span class="menu-bars" aria-hidden="true"></span>
          <span class="sr-only">Sections</span>
        </button>
        <div class="mobile-chrome-copy">
          <span class="brand-lockup brand-lockup--header">
            <img class="brand-wordmark" src="./brand/wordmark-on-dark.svg" width="364" height="57" alt="Dynasty Ticker" decoding="async" />
          </span>
          <strong id="mobile-chrome-title">Your Sleeper league</strong>
        </div>
        <div class="mobile-chrome-actions">
          <button
            type="button"
            id="mobile-home-btn"
            class="mobile-icon-btn hidden"
            title="League home"
            data-action="league-home"
          >
            <span class="home-glyph" aria-hidden="true"></span>
            <span class="sr-only">League home</span>
          </button>
        </div>
        <span id="mobile-home-feedback" class="feedback-chip mobile-share-feedback hidden" role="status">Home</span>
      </header>
      <div class="rail-backdrop" id="rail-backdrop" hidden></div>
      <aside class="control-rail" id="control-rail" aria-label="League controls">
        <div class="brand-panel">
          <span class="brand-lockup brand-lockup--rail">
            <img class="brand-wordmark" src="./brand/wordmark-on-dark.svg" width="364" height="57" alt="" decoding="async" />
          </span>
          <button type="button" id="mobile-rail-close" class="mobile-rail-close" aria-label="Close league controls">
            <span aria-hidden="true">×</span>
          </button>
          <button type="button" id="desk-board-close" class="desk-board-close" aria-label="Close board" aria-controls="control-rail">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <nav id="phone-desk" class="phone-desk" aria-label="Sections"></nav>

        <div id="board-tools" class="board-tools" hidden>
          <p class="eyebrow">Look up</p>
          <div id="board-tools-slot"></div>
        </div>

        <section class="rail-module league-module">
          <div class="module-heading">
            <span class="step-badge">01</span>
            <div>
              <span class="eyebrow">Sleeper</span>
              <h2>League source</h2>
            </div>
          </div>

          <form id="username-search-form" class="league-load-form" novalidate>
            <label for="sleeper-username">Sleeper username</label>
            <input
              id="sleeper-username"
              name="sleeper-username"
              placeholder="username"
              autocomplete="off"
              value=""
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="search"
              required
              aria-describedby="username-error"
            />
            <p id="username-error" class="field-error" hidden role="alert"></p>
            <button id="find-leagues-btn" type="submit">Find leagues</button>
          </form>
          <div id="league-picker" class="league-picker hidden" data-league-picker></div>

          <details id="league-id-fallback" class="league-id-fallback">
            <summary>Have a league ID or URL instead?</summary>
            <form id="league-load-form" class="league-load-form" novalidate>
              <label for="league-id">League ID</label>
              <input
                id="league-id"
                name="league-id"
                placeholder="League ID or Sleeper URL"
                autocomplete="off"
                value=""
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="go"
                aria-describedby="league-id-error"
              />
              <p id="league-id-error" class="field-error" hidden role="alert"></p>
              <button id="load-league-btn" type="submit">Load League</button>
            </form>
          </details>

          <p id="league-status" class="status muted" aria-live="polite">
            <span id="league-status-loader" class="status-loader hidden" aria-hidden="true"></span>
            <span id="league-status-text">Search your Sleeper username to pick a league.</span>
          </p>
        </section>

        <section class="rail-module hidden" id="identity-section">
          <div class="module-heading">
            <span class="step-badge">02</span>
            <div>
              <span class="eyebrow">Manager</span>
              <h2>You are</h2>
            </div>
          </div>
          <label for="me-select">Team</label>
          <select id="me-select"></select>
        </section>

        <div class="rail-footer">
          <button id="home-btn" type="button" class="ghost-btn hidden" title="League home" data-action="league-home">
            <span class="home-glyph" aria-hidden="true"></span>
            <span class="sr-only">League home</span>
          </button>
        </div>
      </aside>

      <button type="button" id="desk-board-open" class="desk-board-open" aria-label="Open board" aria-controls="control-rail">
        <span class="desk-board-bars" aria-hidden="true"></span>
      </button>

      <main class="workspace">
        <header class="workspace-header" id="workspace-header">
          <div class="league-hero">
            <div class="league-avatar" id="league-avatar">
              <img class="league-mark" src="./brand/mark.svg" width="148" height="132" alt="" decoding="async" />
            </div>
            <div class="league-hero-copy">
              <span class="eyebrow" id="hero-eyebrow">Sleeper dynasty league</span>
              <h1 id="hero-title">Your Sleeper league</h1>
              <p class="workspace-lede" id="hero-lede">Type a username. Scores open first.</p>
            </div>
          </div>
          <dl class="state-grid" aria-label="Current session">
            <div>
              <dt>League</dt>
              <dd id="chrome-league-label">Not loaded</dd>
            </div>
            <div>
              <dt>You</dt>
              <dd id="chrome-manager-label">Select team</dd>
            </div>
            <div>
              <dt>Week</dt>
              <dd id="chrome-mode-label">—</dd>
            </div>
          </dl>
        </header>

        <div class="desk-nav" id="desk-nav">
          <nav class="workspace-tabs" id="page-tabs" role="tablist" aria-label="What you can do">
            <button id="players-tab" class="page-tab active" type="button" role="tab" aria-selected="true" aria-controls="players-page" tabindex="0" data-page="players">
              <span class="tab-copy"><strong>Players</strong><small>What is he worth?</small></span>
            </button>
            <button id="trades-tab" class="page-tab" type="button" role="tab" aria-selected="false" aria-controls="trades-page" tabindex="-1" data-page="trades">
              <span class="tab-copy"><strong>Trade</strong><small>Check an offer or find a deal</small></span>
            </button>
            <button id="league-tab" class="page-tab" type="button" role="tab" aria-selected="false" aria-controls="league-page" tabindex="-1" data-page="league">
              <span class="tab-copy"><strong>My League</strong><small id="teams-tab-hint">Your team, this week, the league</small></span>
            </button>
          </nav>
          <nav class="room-nav" id="room-nav" role="tablist" aria-label="On this page"></nav>
        </div>

        <div id="ticker" class="ticker hidden" aria-label="League ticker" aria-pressed="false" title="Tap to pause or resume. Drag to scrub.">
          <span class="ticker-label">Live</span>
          <div class="ticker-viewport">
            <div class="ticker-track" id="ticker-track"></div>
          </div>
        </div>

        <div id="ui-pages"></div>

    <div id="site-dock" class="site-dock">
      <div id="sticky-mobile-cta" class="sticky-mobile-cta" hidden>
        <button id="sticky-find-btn" type="button">Find leagues</button>
      </div>
    </div>

    <script type="module" src="./boot.js"></script>
  </body>
</html>
