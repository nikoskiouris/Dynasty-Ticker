<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://sleepercdn.com https://*.sleepercdn.com; connect-src 'self' https://api.sleeper.app; form-action 'self'; frame-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dynasty Ticker — Trade Calc, Player Rankings & League History</title>
    <meta name="description" content="Trade Calc, Player Rankings and Sleeper League History. Values optimized for 12-team Superflex PPR dynasty." />
    <meta name="theme-color" content="#0c0c0e" />
    <script src="./boot-intent.js"></script>
    <meta property="og:title" content="Dynasty Ticker — Trade Calc, Player Rankings & League History" />
    <meta property="og:description" content="Trade Calc, Player Rankings and Sleeper League History. Values optimized for 12-team Superflex PPR dynasty." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dynastyticker.com/" />
    <meta property="og:image" content="https://dynastyticker.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dynasty Ticker: your league on a live ticker" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dynasty Ticker — Trade Calc, Player Rankings & League History" />
    <meta name="twitter:description" content="Trade Calc, Player Rankings and Sleeper League History. Values optimized for 12-team Superflex PPR dynasty." />
    <meta name="twitter:image" content="https://dynastyticker.com/og-image.jpg" />
    <link rel="canonical" href="https://dynastyticker.com/" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/instrument-sans-latin.woff2" />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="launch-open">
    <a class="skip-link" href="#workspace">Skip to content</a>
    <div id="route-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div class="app-frame">
      <!-- Sleeper connect controls. moveLeagueControls() mounts them on /leagues. -->
      <div id="league-controls" class="league-controls" hidden>
        <section class="rail-module league-module">
          <div class="module-heading">
            <span class="step-badge">01</span>
            <div>
              <span class="eyebrow">Sleeper</span>
              <h2>League source</h2>
            </div>
          </div>

          <form id="username-search-form" class="league-load-form" novalidate>
            <label for="sleeper-username">Sleeper username</label>
            <input
              id="sleeper-username"
              name="sleeper-username"
              maxlength="120"
              placeholder="username"
              autocomplete="off"
              value=""
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="search"
              required
              aria-describedby="username-error"
            />
            <p id="username-error" class="field-error" hidden role="alert"></p>
            <button id="find-leagues-btn" type="submit" data-idle-label="Connect my league" aria-disabled="true" aria-busy="true" data-boot-loading="1">Loading…</button>
          </form>
          <div id="league-picker" class="league-picker hidden" data-league-picker></div>

          <details id="league-id-fallback" class="league-id-fallback">
            <summary>Have a league ID or URL instead?</summary>
            <form id="league-load-form" class="league-load-form" novalidate>
              <label for="league-id">League ID</label>
              <input
                id="league-id"
                name="league-id"
                placeholder="Paste a league link or ID"
                autocomplete="off"
                value=""
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="go"
                aria-describedby="league-id-error"
              />
              <p id="league-id-error" class="field-error" hidden role="alert"></p>
              <button id="load-league-btn" type="submit">Open league</button>
            </form>
          </details>

          <div id="league-status" class="status muted" aria-live="polite">
            <span id="league-status-loader" class="status-loader hidden" aria-hidden="true"></span>
            <span id="league-status-text">Search your Sleeper username to pick a league.</span>
            <button type="button" id="league-status-retry" class="ghost-btn status-retry hidden">Retry</button>
          </div>
        </section>

        <section class="rail-module hidden" id="identity-section">
          <div class="module-heading">
            <span class="step-badge">02</span>
            <div>
              <span class="eyebrow">Manager</span>
              <h2>Your team</h2>
            </div>
          </div>
          <label for="me-select">Team</label>
          <select id="me-select" aria-label="Team"></select>
        </section>

        <div class="rail-footer">
          <button id="disconnect-btn" type="button" class="ghost-btn hidden" data-action="disconnect-league">Disconnect league</button>
        </div>
      </div>

      <main class="workspace" id="workspace" tabindex="-1">
        <h1 id="route-title" class="sr-only">Dynasty Ticker</h1>
        <header class="workspace-header" id="workspace-header">
          <div class="league-hero">
            <div class="league-avatar" id="league-avatar">
              <img class="league-mark" src="./brand/mark.svg" width="148" height="132" alt="" decoding="async" />
            </div>
            <div class="league-hero-copy">
              <span class="eyebrow" id="hero-eyebrow">Sleeper dynasty league</span>
              <p id="hero-title">Your Sleeper league</p>
              <p class="workspace-lede" id="hero-lede">Type a username. Scores open first.</p>
            </div>
          </div>
        </header>

        <div id="desk-load-alert" class="status error desk-load-alert hidden" role="alert">
          <span id="desk-load-alert-text"></span>
          <button type="button" id="desk-load-retry" class="ghost-btn status-retry">Retry</button>
          <button type="button" id="desk-load-dismiss" class="ghost-btn status-retry">Dismiss</button>
        </div>

        <div id="ui-pages"></div>
      </main>
    </div>

    <script type="module" src="./boot.js"></script>
  </body>
</html>
