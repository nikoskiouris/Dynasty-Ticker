<div id="trades-page" class="workspace-page app-page hidden" role="tabpanel" aria-labelledby="trades-tab" data-page="trades">
  <div class="room" data-room-panel="calculator">
    <section class="workspace-panel" id="calculator-section">
      <div id="calculator-shell" class="calculator-shell"></div>
    </section>
    <section class="workspace-panel" id="ranks-section">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">Players</span>
          <h2>What is he worth?</h2>
        </div>
        <p class="section-copy">Search a name. Add him to the trade when you want a verdict.</p>
      </div>
      <div id="ranks-dashboard"></div>
    </section>
  </div>
  <div class="room hidden" data-room-panel="find">
    <section class="workspace-panel" id="trade-match-section">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">Find a trade</span>
          <h2 id="find-heading">Ideas for you</h2>
        </div>
      </div>
      <div id="trade-match-needs" class="match-needs"></div>
      <div id="trade-match-dashboard" class="trade-match-dashboard" aria-live="polite"></div>
    </section>
    <section class="workspace-panel" id="shop-section" aria-labelledby="shop-heading">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">Shop a player</span>
          <h2 id="shop-heading">What is he worth to this league?</h2>
        </div>
        <p class="section-copy">Pick a player to sell or to price. Fair offers from teams in this league.</p>
      </div>
      <div id="shop-panel"></div>
    </section>
    <section class="workspace-panel" id="partners-section" aria-labelledby="partners-heading">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">Partners</span>
          <h2 id="partners-heading">Best partners</h2>
        </div>
      </div>
      <div id="match-partners"></div>
    </section>
  </div>
</div>
