<div id="trades-page" class="workspace-page app-page hidden" role="tabpanel" aria-labelledby="trades-tab" data-page="trades">
  <div class="room" data-room-panel="calculator">
    <section class="workspace-panel" id="calculator-section">
      <div id="calculator-shell" class="calculator-shell"></div>
    </section>
    <section class="workspace-panel" id="ranks-section">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">Players</span>
          <h2>What is he worth?</h2>
        </div>
        <p class="section-copy">Search a name. Add him to the trade when you want a verdict.</p>
      </div>
      <div id="ranks-dashboard"></div>
    </section>
  </div>
  <div class="room hidden" data-room-panel="find">
    <section class="workspace-panel" id="trade-match-section">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">Find a trade</span>
          <h2 id="find-heading">Trade ideas</h2>
        </div>
        <p id="find-trade-intro" class="section-copy">1-for-1 and 2-for-1 ideas that fill a need on both rosters. Review trade opens it in Check a trade.</p>
      </div>
      <div id="trade-match-needs" class="match-needs"></div>
    </section>
    <section class="action-panel" id="match-action-panel">
      <div>
        <span class="eyebrow">Partners</span>
        <h2>Best partners</h2>
        <p id="match-generate-help" class="muted small">Connect my league to see partners.</p>
      </div>
      <div class="action-panel-cta">
        <button id="match-generate-btn" type="button" disabled>Find partners</button>
        <p id="match-generate-error" class="field-error" hidden role="alert"></p>
      </div>
    </section>
    <section class="workspace-panel results-shell" id="trade-match-results">
      <div id="trade-match-dashboard" class="trade-match-dashboard"></div>
    </section>
  </div>
</div>
