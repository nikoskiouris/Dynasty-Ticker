<div id="players-page" class="workspace-page app-page" role="tabpanel" aria-labelledby="players-tab" data-page="players">
  <div class="room" data-room-panel="ranks">
    <section class="workspace-panel" id="ranks-section">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">Players</span>
          <h2>What is he worth?</h2>
        </div>
        <p class="section-copy">Search a name. Add him to a trade when you want a verdict.</p>
      </div>
      <div id="ranks-dashboard"></div>
    </section>
    <div id="landing-rather" class="landing-rather">
      <div class="rather-panel landing-rather-pending">
        <h2 id="rather-title">Who would you rather have?</h2>
        <p class="rather-format" id="rather-format">PPR 12-man Superflex</p>
        <p class="rather-format-detail" id="rather-format-detail">Optional. Vote after you have a value.</p>
        <p class="muted">Loading a close matchup…</p>
      </div>
    </div>
    <details class="workspace-panel" id="passport-fold">
      <summary>Ownership history</summary>
      <div id="passport-dashboard" class="dashboard"></div>
    </details>
  </div>
</div>
