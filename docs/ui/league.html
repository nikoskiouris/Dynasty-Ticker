<div id="league-page" class="workspace-page app-page hidden" role="tabpanel" aria-labelledby="league-tab" data-page="league">
  <div class="room" data-room-panel="team">
    <div id="start-dashboard" class="dashboard start-dashboard hidden"></div>
    <section class="workspace-panel" id="power-section">
      <div class="panel-heading">
        <h2 id="power-heading" tabindex="-1">Outlook</h2>
      </div>
      <div id="power-dashboard" class="power-dashboard">
        <div class="empty-cta">
          <h2 class="empty-cta-title">Connect your league to see your team.</h2>
          <p class="muted">Type your Sleeper username. No name yet? <a id="sample-league-link" class="sample-league-link" href="./?sample=1">See the sample league</a>.</p>
          <button type="button" data-action="find-my-leagues" data-idle-label="Connect my league" aria-disabled="true" aria-busy="true" data-boot-loading="1">Loading…</button>
        </div>
      </div>
      <div id="window-call-dashboard" class="window-call-dashboard"></div>
    </section>
    <section class="workspace-panel hidden" id="roster-sheet-section">
      <div class="panel-heading">
        <h2 id="roster-sheet-heading">Roster</h2>
      </div>
      <div id="roster-sheet" class="roster-sheet"></div>
    </section>
    <div id="standings-dashboard" class="dashboard"></div>
  </div>
</div>
