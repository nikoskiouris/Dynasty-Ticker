<div id="league-page" class="workspace-page app-page hidden" role="region" aria-label="Sleeper league" data-page="league">
  <section class="room hidden" data-room-panel="hub"><h1 id="league-hub-heading" tabindex="-1">League hub</h1><div id="league-hub-content"><p>Loading your league…</p></div></section>
  <section class="room hidden" data-room-panel="standings"><h1 id="league-standings-heading" tabindex="-1">Standings</h1><div id="league-standings-content"><p>Loading standings…</p></div></section>
  <section class="room hidden" data-room-panel="trades"><h1 id="league-trades-heading" tabindex="-1">Trade History</h1><div id="league-trades-content"><p>Loading trade history…</p></div></section>
  <section class="room hidden" data-room-panel="history"><h1 id="league-history-heading" tabindex="-1">Historical Data</h1><div id="league-history-content"><p>Loading league history…</p></div></section>
  <div class="room" data-room-panel="team"><h1 id="league-team-heading" tabindex="-1">My Team</h1>
    <div id="team-header" class="team-header"></div>
    <section id="team-start-sit" class="workspace-panel hidden" aria-labelledby="team-start-sit-heading">
      <div class="panel-heading"><h2 id="team-start-sit-heading">Start/Sit</h2></div>
      <div id="team-start-sit-content"></div>
    </section>
    <div id="start-dashboard" class="dashboard start-dashboard hidden"></div>
    <section class="workspace-panel" id="power-section">
      <div class="panel-heading">
        <h2 id="power-heading" tabindex="-1">Position ranks</h2>
      </div>
      <div id="power-dashboard" class="power-dashboard">
        <div class="empty-cta">
          <button type="button" data-action="find-my-leagues" data-idle-label="Connect my league" aria-disabled="true" aria-busy="true" data-boot-loading="1">Loading…</button>
        </div>
      </div>
    </section>
    <section class="workspace-panel hidden" id="team-superlatives-section" aria-labelledby="team-superlatives-heading">
      <div class="panel-heading">
        <h2 id="team-superlatives-heading">Superlatives</h2>
      </div>
      <div id="team-superlatives" class="team-superlatives"></div>
    </section>
    <section class="workspace-panel hidden" id="roster-sheet-section">
      <div class="panel-heading">
        <h2 id="roster-sheet-heading">Roster</h2>
      </div>
      <div id="roster-sheet" class="roster-sheet"></div>
    </section>
    <div id="standings-dashboard" class="dashboard"></div>
  </div>
</div>
